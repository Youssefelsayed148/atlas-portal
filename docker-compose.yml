services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-portal-db
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_portal
    ports:
      - "5433:5432"
    volumes:
      - atlas_portal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  atlas_portal_data:
    name: atlas_portal_data
